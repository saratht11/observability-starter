<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">@Monitored Annotation — Observability Architecture</text>

  <!-- ── Step 1: @Monitored Method ── -->
  <rect x="30" y="80" width="160" height="70" rx="8" fill="#4361ee" stroke="#3a0ca3" stroke-width="1.5"/>
  <text x="110" y="110" text-anchor="middle" font-size="13" fill="white" font-weight="bold">@Monitored</text>
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#cce0ff">Method Invocation</text>
  <text x="110" y="145" text-anchor="middle" font-size="10" fill="#aad0ff">Spring Bean</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="115" x2="240" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 2: MonitoredAspect ── -->
  <rect x="240" y="80" width="160" height="70" rx="8" fill="#7209b7" stroke="#560bad" stroke-width="1.5"/>
  <text x="320" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold">MonitoredAspect</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#e0c3fc">@Around intercept</text>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#d4a8f0">Spring AOP</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="115" x2="450" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 3: MonitoredTagResolver ── -->
  <rect x="450" y="80" width="160" height="70" rx="8" fill="#f72585" stroke="#b5179e" stroke-width="1.5"/>
  <text x="530" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Tag Resolver</text>
  <text x="530" y="124" text-anchor="middle" font-size="11" fill="#ffc8dd">Static + SpEL tags</text>
  <text x="530" y="140" text-anchor="middle" font-size="10" fill="#ffb3c6">Low / High cardinality</text>

  <!-- Arrow 3 -->
  <line x1="610" y1="115" x2="660" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Step 4: LatencyRecorder ── -->
  <rect x="660" y="80" width="160" height="70" rx="8" fill="#0096c7" stroke="#0077b6" stroke-width="1.5"/>
  <text x="740" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold">LatencyRecorder</text>
  <text x="740" y="124" text-anchor="middle" font-size="11" fill="#caf0f8">Timer / LongTaskTimer</text>
  <text x="740" y="140" text-anchor="middle" font-size="10" fill="#90e0ef">Error Counter</text>

  <!-- ── Vertical arrows from MonitoredAspect down ── -->
  <line x1="320" y1="150" x2="320" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="150" x2="740" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── BaggageReader ── -->
  <rect x="240" y="200" width="160" height="70" rx="8" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.5"/>
  <text x="320" y="227" text-anchor="middle" font-size="13" fill="white" font-weight="bold">BaggageReader</text>
  <text x="320" y="244" text-anchor="middle" font-size="11" fill="#95d5b2">OtelBaggageReader</text>
  <text x="320" y="260" text-anchor="middle" font-size="10" fill="#74c69d">OpenTelemetry context</text>

  <!-- ── MeterRegistry ── -->
  <rect x="660" y="200" width="160" height="70" rx="8" fill="#e9c46a" stroke="#f4a261" stroke-width="1.5"/>
  <text x="740" y="227" text-anchor="middle" font-size="13" fill="#1a1a2e" font-weight="bold">MeterRegistry</text>
  <text x="740" y="244" text-anchor="middle" font-size="11" fill="#3d2b00">Micrometer</text>
  <text x="740" y="260" text-anchor="middle" font-size="10" fill="#5c3d00">Prometheus / OTLP</text>

  <!-- ── Span creation ── -->
  <line x1="320" y1="270" x2="320" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="330" width="160" height="70" rx="8" fill="#495057" stroke="#343a40" stroke-width="1.5"/>
  <text x="320" y="357" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Tracer / Span</text>
  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#ced4da">createSpan=true</text>
  <text x="320" y="390" text-anchor="middle" font-size="10" fill="#adb5bd">micrometer-tracing</text>

  <!-- ── Metrics output ── -->
  <line x1="740" y1="270" x2="740" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="330" width="160" height="70" rx="8" fill="#52b788" stroke="#40916c" stroke-width="1.5"/>
  <text x="740" y="354" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Metrics Output</text>
  <text x="740" y="371" text-anchor="middle" font-size="11" fill="#d8f3dc">&lt;metric&gt;.latency</text>
  <text x="740" y="387" text-anchor="middle" font-size="10" fill="#b7e4c7">&lt;metric&gt;.error.total</text>

  <!-- ── Legend ── -->
  <rect x="30" y="450" width="840" height="90" rx="8" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="450" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057">Emitted Metrics per @Monitored Method</text>
  <rect x="60" y="485" width="12" height="12" fill="#0096c7" rx="2"/>
  <text x="80" y="496" font-size="11" fill="#343a40">&lt;metric&gt;.latency — Timer (p50/p90/p99 optional)</text>
  <rect x="320" y="485" width="12" height="12" fill="#52b788" rx="2"/>
  <text x="340" y="496" font-size="11" fill="#343a40">&lt;metric&gt;.latency.active — LongTaskTimer (trackActive=true)</text>
  <rect x="640" y="485" width="12" height="12" fill="#f72585" rx="2"/>
  <text x="660" y="496" font-size="11" fill="#343a40">&lt;metric&gt;.error.total — Counter</text>

  <text x="80" y="525" font-size="10" fill="#6c757d">Tags: component · static tags · dynamic (SpEL) low-cardinality tags · optional baggage fields</text>
  <text x="80" y="540" font-size="10" fill="#6c757d">Span tags (high-cardinality): spanTags only — never added to metrics</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
